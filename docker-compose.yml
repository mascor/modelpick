services:
  web:
    build: .
    image: modelpick:latest
    container_name: modelpick-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 8031
    # Bound to loopback only: nginx on the host terminates TLS and proxies here.
    ports: ["127.0.0.1:8031:8031"]
    volumes: ["./data:/app/data"]

  scheduler:
    build: .
    image: modelpick:latest
    container_name: modelpick-scheduler
    restart: unless-stopped
    env_file: [.env]
    command: ["node", "dist/scheduler.js"]
    # Lo scheduler non espone HTTP: l'health check dell'immagine non lo riguarda.
    healthcheck: { disable: true }
    volumes: ["./data:/app/data"]
