<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; display: flex; flex-direction: column; justify-content: center;
    padding: 0 84px; font-family: Inter, sans-serif; color: #fff;
    background: radial-gradient(circle at 85% 12%, #e0308066, transparent 46%),
                radial-gradient(circle at 8% 96%, #60288899, transparent 52%), #17141c;
  }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
  .brand img { width: 56px; height: 56px; border-radius: 12px; }
  .name { font-size: 30px; font-weight: 800; letter-spacing: .04em; }
  .by { font-size: 20px; color: #cdc9d3; }
  h1 { font-size: 74px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em; max-width: 20ch; }
  p { margin-top: 28px; font-size: 27px; line-height: 1.45; color: #e2dfe8; max-width: 44ch; }
  .line { margin-top: 44px; display: flex; gap: 14px; align-items: center; font-size: 21px; color: #f0b6d4; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #e03080; }
</style></head><body>
  <div class="brand"><img src="favicon-192.png"><span class="name">MODELPICK</span><span class="by">by CloudSalus</span></div>
  <h1>The right model.<br>The cheapest provider.</h1>
  <p>Which AI model to use for coding today, which one to keep for hard problems, and where to buy it.</p>
  <div class="line"><span class="dot"></span><span>Prices and quality checked every day · open source</span></div>
</body></html>
